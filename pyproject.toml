[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "via-leite-sense"
version = "0.1.0"
description = "VIA LEITE SENSE — plataforma de monitoramento leiteiro (API, motor de score, ingestão e modelo)"
requires-python = ">=3.10"
# via_leite_edge só depende de pandas (demais imports são stdlib).
dependencies = [
  "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
# fastapi/httpx entram por causa de tests/test_api_auth.py, que sobe a API com
# o TestClient do Starlette para provar que nenhuma rota responde sem chave.
test = [
  "pytest>=8.0",
  "fastapi>=0.111,<1.0",
  "httpx>=0.27",
]

# Os módulos que viviam soltos na raiz passaram a `via_leite/` em 25/08/2026.
# Pacote de raiz e não `src/` layout de propósito: o nixpacks da Railway instala
# as dependências ANTES de copiar o código, então `pip install -e .` não teria o
# que instalar e um `src/` exigiria fixar PYTHONPATH.
[tool.setuptools]
packages = [
  "via_leite",
  "via_leite.core",
  "via_leite.ingest",
  "via_leite.models",
  "via_leite.store",
  "via_leite_edge",
  "via_leite.api",
]
